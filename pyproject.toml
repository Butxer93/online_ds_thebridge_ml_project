[project]
name = "financial-complaints-predictor"
version = "1.1.0"
description = "Sistema de predicción y análisis de quejas financieras"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Ibon Etxebarria", email = "iktetxebarriaib@gmail.com"}
]
keywords = ["machine-learning", "financial-analysis", "complaints", "prediction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.1.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "scipy>=1.9.0",
    "typing-extensions>=4.0.0",
    'pickle5>=0.0.12; python_version < "3.8"',
    "tqdm>=4.64.0",
    "streamlit>=1.28.0",
]
